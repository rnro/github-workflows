name: Execute matrix

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      name:
        type: string
        description: "The name of the workflow used for the concurrency group."
        required: true
      matrix_yaml_string:
        type: string
        description: "The YAML string containing the matrix definition."
        required: true
      command:
        type: string
        description: "Command to run for matrix entries that do not specify their own. Lets a caller pair a toolchain matrix with its own command."
        default: ""
      setup_command:
        type: string
        description: "Setup command for matrix entries that do not specify their own."
        default: ""
      command_arguments:
        type: string
        description: "Whitespace-separated arguments appended to entries that do not specify their own."
        default: ""
      env:
        type: string
        description: "Environment variables (JSON or YAML object) for every entry. Per-entry values win on a key-by-key basis."
        default: "{}"
      job_timeout:
        type: number
        description: "Timeout in minutes for each job (default: 60)"
        default: 60
      windows_job_timeout:
        type: number
        description: "Timeout in minutes for Windows jobs. 0 uses job_timeout. Windows installs a toolchain and Visual Studio Build Tools before building, so it often needs longer."
        default: 0
      needs_token:
        type: boolean
        description: "Whether to provide GITHUB_TOKEN to jobs"
        default: false
      enable_cross_pr_testing:
        type: boolean
        description: "Whether PRs can be tested together with linked PRs mentioned in the PR description"
        default: false

# We will cancel previously triggered workflow runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.name }}
  cancel-in-progress: true

jobs:
  convert-matrix:
    name: Convert matrix YAML to JSON
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.convert.outputs.matrix }}
    steps:
      - name: Convert YAML to JSON
        id: convert
        env:
          MATRIX_YAML: ${{ inputs.matrix_yaml_string }}
          DEFAULT_COMMAND: ${{ inputs.command }}
          DEFAULT_SETUP_COMMAND: ${{ inputs.setup_command }}
          DEFAULT_COMMAND_ARGUMENTS: ${{ inputs.command_arguments }}
          DEFAULT_ENV: ${{ inputs.env }}
        run: |
          set -euo pipefail

          default_env=$(echo "$DEFAULT_ENV" | yq -o=json '. // {}')

          # Entries that carry their own command, setup command, arguments or env
          # keep them; anything they leave out is filled from the workflow inputs.
          # This is what lets a toolchain-only matrix be paired with a command.
          matrix=$(echo "$MATRIX_YAML" | yq -o=json '.config // []' | jq -c \
            --arg command "$DEFAULT_COMMAND" \
            --arg setup_command "$DEFAULT_SETUP_COMMAND" \
            --arg command_arguments "$DEFAULT_COMMAND_ARGUMENTS" \
            --argjson default_env "$default_env" \
            '{config: [
                .[]
                | if (.command // "") == "" then .command = $command else . end
                | if (.setup_command // "") == "" then .setup_command = $setup_command else . end
                | if ((.command_arguments // []) | length) == 0
                  then .command_arguments = ($command_arguments | split(" ") | map(select(. != "")))
                  else . end
                | .env = ($default_env + (.env // {}))
             ]}')

          missing=$(echo "$matrix" | jq -r '[.config[] | select((.command // "") == "") | .name] | join(", ")')
          if [ -n "$missing" ]; then
            echo "::error::No command for matrix entries: $missing. Set it on the entry or pass the workflow's command input."
            exit 1
          fi

          # Say what will run. An empty matrix is legitimate — a disabled
          # platform produces one — but it looks identical to success in the
          # jobs list, so it is worth stating outright.
          count=$(echo "$matrix" | jq -r '.config | length')
          if [ "$count" -eq 0 ]; then
            echo "::notice::No matrix entries; this workflow call will run no jobs."
          else
            echo "::notice::Running $count job(s): $(echo "$matrix" | jq -r '[.config[].name] | join(", ")')"
          fi

          echo "matrix<<MATRIX_EOF" >> $GITHUB_OUTPUT
          echo "$matrix" >> $GITHUB_OUTPUT
          echo "MATRIX_EOF" >> $GITHUB_OUTPUT

  execute-matrix:
    name: ${{ matrix.config.name }}
    needs: convert-matrix
    runs-on: ${{ matrix.config.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.convert-matrix.outputs.matrix) }}
    env:
      # The version label, for anything that keys data on it — benchmark
      # thresholds most notably. Every platform has to be listed: a platform
      # missing from this expression gets an empty value rather than an error.
      SWIFT_VERSION: >-
        ${{ matrix.config.swift_build.version
            || matrix.config.xcode_build.swift_version
            || matrix.config.xcode_build.xcode_version
            || matrix.config.freebsd.swift_version
            || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - name: Checkout swiftlang/github-workflows repository
        if: ${{ github.repository != 'swiftlang/github-workflows' }}
        uses: actions/checkout@v7
        with:
          repository: swiftlang/github-workflows
          path: github-workflows
          persist-credentials: false
      - name: Determine script-root path
        id: script_path
        shell: bash
        run: |
          if [ "$GITHUB_REPOSITORY" = "swiftlang/github-workflows" ]; then
            root="$GITHUB_WORKSPACE"
          else
            root="$GITHUB_WORKSPACE/github-workflows"
          fi
          echo "root=$root" >> $GITHUB_OUTPUT
          # Windows needs backslash paths for PowerShell
          echo "root_win=$(echo "$root" | sed 's|/|\\|g')" >> $GITHUB_OUTPUT
      - name: Check out linked PRs (macOS)
        # Linux and Windows do this inside their runner scripts, after installing
        # a toolchain to compile the script with. macOS has Xcode already, so a
        # step is enough. A failure fails the job: carrying on would test the
        # wrong code and report success.
        if: ${{ inputs.enable_cross_pr_testing && github.event_name == 'pull_request' && matrix.config.platform == 'macOS' }}
        shell: bash
        env:
          SCRIPTS_ROOT_PATH: ${{ steps.script_path.outputs.root }}/.github/workflows/scripts
          PR_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          cp "$SCRIPTS_ROOT_PATH/cross-pr-checkout.swift" /tmp/cross-pr-checkout.swift
          swift /tmp/cross-pr-checkout.swift "$PR_REPO" "$PR_NUMBER"
      - name: Run matrix job (Linux)
        if: ${{ matrix.config.platform == 'Linux' }}
        timeout-minutes: ${{ inputs.job_timeout }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCRIPTS_ROOT: ${{ steps.script_path.outputs.root }}/.github/workflows/scripts
          CONTAINER_JSON: ${{ toJson(matrix.config.swift_build.container) }}
          MATRIX_SWIFT_VERSION: ${{ matrix.config.swift_build.version }}
          MATRIX_TOOLCHAIN: ${{ matrix.config.swift_build.toolchain }}
          MATRIX_SWIFTLY: ${{ matrix.config.swift_build.swiftly }}
          MATRIX_SETUP_COMMAND: ${{ matrix.config.setup_command }}
          MATRIX_COMMAND: ${{ matrix.config.command }}
          MATRIX_COMMAND_ARGUMENTS: ${{ toJson(matrix.config.command_arguments) }}
          MATRIX_ENV: ${{ toJson(matrix.config.env) }}
          NEEDS_TOKEN: ${{ inputs.needs_token }}
          MATRIX_SDK: ${{ toJson(matrix.config.swift_build.sdk) }}
          CROSS_PR_TESTING: ${{ inputs.enable_cross_pr_testing && github.event_name == 'pull_request' }}
          CROSS_PR_REPO: ${{ github.repository }}
          CROSS_PR_NUMBER: ${{ github.event.number }}
        run: |
          "$SCRIPTS_ROOT/run-matrix-linux.sh" \
            "$MATRIX_SWIFT_VERSION" \
            "$MATRIX_SETUP_COMMAND" \
            "$MATRIX_COMMAND" \
            "$MATRIX_COMMAND_ARGUMENTS" \
            "$MATRIX_ENV" \
            "$NEEDS_TOKEN" \
            "$MATRIX_SDK"
      - name: Enable KVM and free disk space
        if: ${{ matrix.config.android_emulator == true && matrix.config.platform == 'Linux' }}
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo rm -rf /opt/microsoft /opt/google /opt/az /opt/ghc /usr/share/dotnet /usr/local/share/boost /opt/hostedtoolcache /usr/local/share/chromium
          df -h
      - name: Run Android emulator tests
        if: ${{ matrix.config.android_emulator == true && matrix.config.platform == 'Linux' }}
        shell: bash
        env:
          SCRIPTS_ROOT_PATH: ${{ steps.script_path.outputs.root }}/.github/workflows/scripts
          SDK_TRIPLES: ${{ join(matrix.config.swift_build.sdk.triples, ' --android-sdk-triple=') }}
        run: |
          # The SDK build step already produced the test binaries, and
          # install-and-build-with-sdk.sh exported the matched toolchain and SDK
          # bundle to GITHUB_ENV for this script to pick up.
          # Intentional word splitting to pass multiple --android-sdk-triple arguments
          # shellcheck disable=SC2086
          "$SCRIPTS_ROOT_PATH/android/android-emulator-tests.sh" \
            --android-sdk-triple=$SDK_TRIPLES
      - name: Run matrix job (Windows)
        if: ${{ matrix.config.platform == 'Windows' }}
        timeout-minutes: ${{ inputs.windows_job_timeout > 0 && inputs.windows_job_timeout || inputs.job_timeout }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCRIPTS_ROOT: ${{ steps.script_path.outputs.root_win }}\.github\workflows\scripts
          CONTAINER_IMAGE: ${{ matrix.config.swift_build.container.image }}
          CROSS_PR_TESTING: ${{ inputs.enable_cross_pr_testing && github.event_name == 'pull_request' }}
          CROSS_PR_REPO: ${{ github.repository }}
          CROSS_PR_NUMBER: ${{ github.event.number }}
          MATRIX_SWIFT_VERSION: ${{ matrix.config.swift_build.version }}
          MATRIX_TOOLCHAIN: ${{ matrix.config.swift_build.toolchain }}
          MATRIX_SETUP_COMMAND: ${{ matrix.config.setup_command }}
          MATRIX_COMMAND: ${{ matrix.config.command }}
          MATRIX_COMMAND_ARGUMENTS: ${{ toJson(matrix.config.command_arguments) }}
          MATRIX_ENV: ${{ toJson(matrix.config.env) }}
          NEEDS_TOKEN: ${{ inputs.needs_token }}
        shell: pwsh
        run: |
          & "$env:SCRIPTS_ROOT\windows\run-matrix-windows.ps1" `
            -SwiftVersion "$env:MATRIX_SWIFT_VERSION" `
            -SetupCommand "$env:MATRIX_SETUP_COMMAND" `
            -Command "$env:MATRIX_COMMAND" `
            -CommandArguments $env:MATRIX_COMMAND_ARGUMENTS `
            -EnvJson $env:MATRIX_ENV `
            -NeedsToken "$env:NEEDS_TOKEN"
      - name: Run matrix job (macOS)
        if: ${{ matrix.config.platform == 'macOS' }}
        timeout-minutes: ${{ inputs.job_timeout }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCRIPTS_ROOT: ${{ steps.script_path.outputs.root }}/.github/workflows/scripts
          XCODE_TARGETS_JSON: ${{ toJson(matrix.config.xcode_build.targets) }}
          XCODE_DEBUG_OUTPUT: ${{ matrix.config.xcode_build.debug_output }}
          SWIFTLY_TOOLCHAIN: ${{ matrix.config.xcode_build.swiftly_toolchain }}
          MATRIX_XCODE_VERSION: ${{ matrix.config.xcode_build.xcode_version }}
          MATRIX_SWIFT_VERSION: ${{ matrix.config.xcode_build.swift_version }}
          MATRIX_SETUP_COMMAND: ${{ matrix.config.setup_command }}
          MATRIX_COMMAND: ${{ matrix.config.command }}
          MATRIX_COMMAND_ARGUMENTS: ${{ toJson(matrix.config.command_arguments) }}
          MATRIX_ENV: ${{ toJson(matrix.config.env) }}
          NEEDS_TOKEN: ${{ inputs.needs_token }}
        run: |
          "$SCRIPTS_ROOT/run-matrix-macos.sh" \
            "$MATRIX_XCODE_VERSION" \
            "$MATRIX_SWIFT_VERSION" \
            "$MATRIX_SETUP_COMMAND" \
            "$MATRIX_COMMAND" \
            "$MATRIX_COMMAND_ARGUMENTS" \
            "$MATRIX_ENV" \
            "$NEEDS_TOKEN"
      - name: Run matrix job (FreeBSD)
        if: ${{ matrix.config.platform == 'FreeBSD' }}
        uses: vmactions/freebsd-vm@v1
        env:
          SWIFT_WEB_URL: ${{ matrix.config.freebsd.swift_url }}
          BUILD_FLAGS: ${{ matrix.config.freebsd.build_flags }}
          FREEBSD_ENV_VARS: ${{ matrix.config.freebsd.env_vars }}
          MATRIX_SETUP_COMMAND: ${{ matrix.config.setup_command }}
          MATRIX_COMMAND: ${{ matrix.config.command }}
          CROSS_PR_ENABLED: ${{ inputs.enable_cross_pr_testing && github.event_name == 'pull_request' }}
          CROSS_PR_REPO: ${{ github.repository }}
          CROSS_PR_NUMBER: ${{ github.event.number }}
        with:
          envs: 'SWIFT_WEB_URL BUILD_FLAGS GITHUB_TOKEN FREEBSD_ENV_VARS MATRIX_SETUP_COMMAND MATRIX_COMMAND CROSS_PR_ENABLED CROSS_PR_REPO CROSS_PR_NUMBER'
          release: "${{ matrix.config.freebsd.os_version }}"
          arch: "x86_64"
          sync: rsync
          copyback: false
          usesh: true
          prepare: |
            fetch -o /tmp/swift.tar.gz "$SWIFT_WEB_URL"
            mkdir -p /opt/swift
            tar -xzf /tmp/swift.tar.gz -C /opt/swift
            pkg install -y git sqlite3 libuuid python3 curl brotli bash
            git config --global init.defaultBranch 'main'
            /opt/swift/usr/bin/swift --version
          run: |
            export PATH="/opt/swift/usr/bin:$PATH"
            swift --version
            if [ -n "$FREEBSD_ENV_VARS" ]; then
              printf '%s\n' "$FREEBSD_ENV_VARS" > /tmp/.env_vars
              while IFS= read -r _line || [ -n "$_line" ]; do
                export "$_line"
              done < /tmp/.env_vars
            fi
            if [ "$CROSS_PR_ENABLED" = "true" ]; then
              if [ -d "github-workflows" ]; then
                SCRIPT_ROOT="github-workflows"
              else
                SCRIPT_ROOT="."
              fi
              cat "$SCRIPT_ROOT/.github/workflows/scripts/cross-pr-checkout.swift" > /tmp/cross-pr-checkout.swift
              swift /tmp/cross-pr-checkout.swift "$CROSS_PR_REPO" "$CROSS_PR_NUMBER"
            fi
            if [ -n "$MATRIX_SETUP_COMMAND" ]; then
              eval "$MATRIX_SETUP_COMMAND"
            fi
            eval "$MATRIX_COMMAND $BUILD_FLAGS"
