name: Toolchain matrix

permissions:
  contents: read

# Emits the supported toolchain axis — platforms, runners, Swift versions and
# container images — without a command, for a caller to pair with its own via
# execute_matrix.yml's `command` input.
#
# This is the middle ground between package_test.yml, which decides both the
# toolchains and the work, and hand-writing a matrix, which decides neither for
# you. Use it for any job kind package_test.yml does not cover: integration
# tests, spec suites, custom scripts.
#
#   jobs:
#     toolchains:
#       uses: swiftlang/github-workflows/.github/workflows/toolchain_matrix.yml@<version>
#       with:
#         linux_swift_versions: '["6.3", "nightly-release"]'
#     integration-tests:
#       needs: toolchains
#       uses: swiftlang/github-workflows/.github/workflows/execute_matrix.yml@<version>
#       with:
#         name: "Integration tests"
#         matrix_yaml_string: ${{ needs.toolchains.outputs.matrix_yaml }}
#         setup_command: "apt-get update -yq && apt-get install -yq lsof"
#         command: "./scripts/integration_tests.sh"
#
# The output is a plain YAML matrix, so it can also be filtered or extended with
# `yq` before being executed — that is how non-rectangular matrices, private
# registry images and mixed native/containerised runs are expressed.

on:
  workflow_call:
    inputs:
      enable_linux:
        type: boolean
        description: "Include Linux toolchains. Defaults to true."
        default: true
      enable_macos:
        type: boolean
        description: "Include macOS toolchains. Defaults to false."
        default: false
      enable_windows:
        type: boolean
        description: "Include Windows toolchains. Defaults to false."
        default: false
      linux_swift_versions:
        type: string
        description: "Linux Swift version list (JSON/YAML array)."
        default: '["6.1", "6.2", "6.3", "nightly-release", "nightly-main"]'
      linux_host_archs:
        type: string
        description: "Linux host architecture list (JSON/YAML array)."
        default: '["x86_64"]'
      linux_use_docker:
        type: boolean
        description: "Emit container images instead of native swiftly toolchains."
        default: false
      linux_os:
        type: string
        description: "Linux OS for container images. Used when linux_os_versions is not set."
        default: "noble"
      linux_os_versions:
        type: string
        description: "Linux OS list (JSON/YAML array). Implies linux_use_docker."
        default: ""
      macos_swift_versions:
        type: string
        description: "macOS Swift version list (JSON/YAML array)."
        default: ""
      macos_xcode_versions:
        type: string
        description: "macOS Xcode version list (JSON/YAML array). Ignored if macos_swift_versions is set."
        default: ""
      macos_os:
        type: string
        description: "macOS runner OS label."
        default: "tahoe"
      macos_arch:
        type: string
        description: "macOS runner architecture label."
        default: "ARM64"
      macos_runner_pool:
        type: string
        description: "macOS self-hosted runner pool label."
        default: "general"
      windows_swift_versions:
        type: string
        description: "Windows Swift version list (JSON/YAML array)."
        default: '["6.1", "6.2", "6.3", "nightly-release", "nightly-main"]'
      windows_os_versions:
        type: string
        description: "Windows OS runner list (JSON/YAML array)."
        default: '["windows-2022"]'
      enable_windows_docker:
        type: boolean
        description: "Emit container images for Windows entries."
        default: false
      linux_env_vars:
        type: string
        description: "Environment variables for Linux entries (JSON/YAML object)."
        default: "{}"
      macos_env_vars:
        type: string
        description: "Environment variables for macOS entries (JSON/YAML object)."
        default: "{}"
      windows_env_vars:
        type: string
        description: "Environment variables for Windows entries (JSON/YAML object)."
        default: "{}"
      minimum_swift_version:
        type: string
        description: "Minimum Swift version. Empty auto-detects from Package.swift, 'none' disables filtering."
        default: ""
      find_subdirectory_manifests:
        type: boolean
        description: "Check subdirectory Package.swift files when detecting the minimum version."
        default: false
    outputs:
      matrix_yaml:
        description: "The toolchain matrix, as a YAML string to pass to execute_matrix.yml."
        value: ${{ jobs.generate-toolchain-matrix.outputs.matrix_yaml }}

jobs:
  generate-toolchain-matrix:
    name: Generate toolchain matrix
    runs-on: ubuntu-latest
    outputs:
      matrix_yaml: ${{ steps.generate.outputs.matrix_yaml }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout swiftlang/github-workflows repository
        if: ${{ github.repository != 'swiftlang/github-workflows' }}
        uses: actions/checkout@v7
        with:
          repository: swiftlang/github-workflows
          path: github-workflows
          persist-credentials: false
      - name: Determine script-root path
        id: script_path
        run: |
          if [ "$GITHUB_REPOSITORY" = "swiftlang/github-workflows" ]; then
            echo "root=$GITHUB_WORKSPACE" >> $GITHUB_OUTPUT
          else
            echo "root=$GITHUB_WORKSPACE/github-workflows" >> $GITHUB_OUTPUT
          fi
      - name: Generate matrix
        id: generate
        env:
          SCRIPT_ROOT: ${{ steps.script_path.outputs.root }}
          MATRIX_MODE: toolchains
          ENABLE_LINUX: ${{ inputs.enable_linux }}
          ENABLE_MACOS: ${{ inputs.enable_macos }}
          ENABLE_WINDOWS: ${{ inputs.enable_windows }}
          LINUX_SWIFT_VERSIONS: ${{ inputs.linux_swift_versions }}
          LINUX_HOST_ARCHS: ${{ inputs.linux_host_archs }}
          LINUX_USE_DOCKER: ${{ inputs.linux_use_docker }}
          LINUX_OS: ${{ inputs.linux_os }}
          LINUX_OS_VERSIONS: ${{ inputs.linux_os_versions }}
          MACOS_SWIFT_VERSIONS: ${{ inputs.macos_swift_versions }}
          MACOS_XCODE_VERSIONS: ${{ inputs.macos_xcode_versions }}
          MACOS_OS: ${{ inputs.macos_os }}
          MACOS_ARCH: ${{ inputs.macos_arch }}
          MACOS_RUNNER_POOL: ${{ inputs.macos_runner_pool }}
          WINDOWS_SWIFT_VERSIONS: ${{ inputs.windows_swift_versions }}
          WINDOWS_OS_VERSIONS: ${{ inputs.windows_os_versions }}
          ENABLE_WINDOWS_DOCKER: ${{ inputs.enable_windows_docker }}
          LINUX_ENV_VARS: ${{ inputs.linux_env_vars }}
          MACOS_ENV_VARS: ${{ inputs.macos_env_vars }}
          WINDOWS_ENV_VARS: ${{ inputs.windows_env_vars }}
          MATRIX_MIN_SWIFT_VERSION: ${{ inputs.minimum_swift_version }}
          FIND_SUBDIRECTORY_MANIFESTS_ENABLED: ${{ inputs.find_subdirectory_manifests }}
        run: |
          matrix_yaml=$("${SCRIPT_ROOT}/.github/workflows/scripts/generate-matrix.sh")
          echo "matrix_yaml<<EOF" >> $GITHUB_OUTPUT
          echo "$matrix_yaml" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
