name: Release Build

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      enable_linux:
        type: boolean
        description: "Run release builds on Linux."
        default: true
      enable_windows:
        type: boolean
        description: "Run release builds on Windows."
        default: false
      enable_macos:
        type: boolean
        description: "Run release builds on macOS."
        default: false
      linux_swift_versions:
        type: string
        description: "Linux Swift version list (JSON array)."
        default: '["6.1", "6.2", "6.3", "nightly-release", "nightly-main"]'
      windows_swift_versions:
        type: string
        description: "Windows Swift version list (JSON array)."
        default: '["6.1", "6.2", "6.3", "nightly-release", "nightly-main"]'
      macos_swift_versions:
        type: string
        description: "macOS Swift version list (JSON array)."
        default: '["6.1", "6.2", "6.3"]'
      windows_use_docker:
        type: boolean
        description: "Run Windows builds inside Docker containers."
        default: false
      windows_os_versions:
        type: string
        description: "Windows OS runner list (JSON array)."
        default: '["windows-2022"]'
      macos_runner_pool:
        type: string
        description: "macOS self-hosted runner pool label."
        default: "general"
      macos_os:
        type: string
        description: "macOS runner OS label."
        default: "tahoe"
      macos_arch:
        type: string
        description: "macOS runner architecture label."
        default: "ARM64"
      swift_flags:
        type: string
        description: "Extra flags for release version builds."
        default: ""
      swift_nightly_flags:
        type: string
        description: "Extra flags for nightly version builds."
        default: ""
      pre_build_command:
        type: string
        description: "Command to run before building (all platforms)."
        default: ""
      minimum_swift_version:
        type: string
        description: "Minimum Swift version. Empty for auto-detection, 'none' to disable."
        default: ""
      name:
        type: string
        description: "Name used for the concurrency group. Set this when a workflow calls release_build.yml more than once, or the calls cancel each other."
        default: "release-builds"
      job_timeout:
        type: number
        description: "Timeout in minutes for each job."
        default: 60
      needs_token:
        type: boolean
        description: "Whether to provide GITHUB_TOKEN to jobs."
        default: false

      workflows_repository:
        type: string
        description: "Repository to take the matrix scripts from. Point this at a fork to test a change to the workflows before it lands; it carries no version, so Dependabot has only the `uses:` line to bump."
        default: "swiftlang/github-workflows"
      workflows_ref:
        type: string
        description: "Ref to take the scripts from. Empty uses workflows_repository's default branch, which is correct for a released version; set it when workflows_repository is a fork whose default branch does not carry the change."
        default: ""
jobs:
  generate-matrix:
    name: Generate release build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix_yaml: ${{ steps.generate.outputs.matrix_yaml }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve the workflows source
        id: workflows_source
        shell: bash
        env:
          WORKFLOWS_REPOSITORY: ${{ inputs.workflows_repository }}
          WORKFLOWS_REF: ${{ inputs.workflows_ref }}
        run: |
          set -euo pipefail

          # Empty means the default branch, which is where the scripts live for a
          # released version. The ref cannot be derived from the workflow that is
          # running: `github.job_workflow_sha` is empty inside a reusable
          # workflow's own jobs. A caller pinning a tag therefore gets that tag's
          # workflow with the default branch's scripts unless it sets this.
          echo "ref=$WORKFLOWS_REF" >> $GITHUB_OUTPUT

          if [ "$GITHUB_REPOSITORY" = "$WORKFLOWS_REPOSITORY" ]; then
            echo "needs_checkout=false" >> $GITHUB_OUTPUT
            echo "root_directory=$GITHUB_WORKSPACE" >> $GITHUB_OUTPUT
          else
            echo "needs_checkout=true" >> $GITHUB_OUTPUT
            echo "root_directory=$GITHUB_WORKSPACE/github-workflows" >> $GITHUB_OUTPUT
          fi
      - name: Checkout the workflows repository
        if: ${{ steps.workflows_source.outputs.needs_checkout == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.workflows_repository }}
          ref: ${{ steps.workflows_source.outputs.ref }}
          path: github-workflows
          persist-credentials: false
      - name: Generate matrix
        id: generate
        run: |
          matrix_yaml=$("${WORKFLOWS_CHECKOUT}/.github/workflows/scripts/matrix/generate-matrix.sh")
          echo "matrix_yaml<<EOF" >> $GITHUB_OUTPUT
          echo "$matrix_yaml" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          WORKFLOWS_CHECKOUT: ${{ steps.workflows_source.outputs.root_directory }}
          ENABLE_LINUX: ${{ inputs.enable_linux }}
          ENABLE_MACOS: ${{ inputs.enable_macos }}
          ENABLE_WINDOWS: ${{ inputs.enable_windows }}
          LINUX_SWIFT_VERSIONS: ${{ inputs.linux_swift_versions }}
          WINDOWS_SWIFT_VERSIONS: ${{ inputs.windows_swift_versions }}
          MACOS_SWIFT_VERSIONS: ${{ inputs.macos_swift_versions }}
          LINUX_BUILD_COMMAND: "swift build -c release"
          MACOS_BUILD_COMMAND: "xcrun swift build -c release"
          WINDOWS_BUILD_COMMAND: "swift build -c release"
          LINUX_PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
          MACOS_PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
          WINDOWS_PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
          SWIFT_FLAGS: ${{ inputs.swift_flags }}
          SWIFT_NIGHTLY_FLAGS: ${{ inputs.swift_nightly_flags }}
          WINDOWS_USE_DOCKER: ${{ inputs.windows_use_docker }}
          WINDOWS_OS_VERSIONS: ${{ inputs.windows_os_versions }}
          MACOS_RUNNER_POOL: ${{ inputs.macos_runner_pool }}
          MACOS_OS: ${{ inputs.macos_os }}
          MACOS_ARCH: ${{ inputs.macos_arch }}
          MINIMUM_SWIFT_VERSION: ${{ inputs.minimum_swift_version }}

  release-builds:
    name: Release builds
    needs: generate-matrix
    uses: ./.github/workflows/execute_matrix.yml
    with:
      name: ${{ inputs.name }}
      matrix_yaml_string: ${{ needs.generate-matrix.outputs.matrix_yaml }}
      workflows_repository: ${{ inputs.workflows_repository }}
      workflows_ref: ${{ inputs.workflows_ref }}
      job_timeout: ${{ inputs.job_timeout }}
      needs_token: ${{ inputs.needs_token }}
