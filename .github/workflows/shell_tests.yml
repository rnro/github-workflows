name: Shell Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  license-header-check:
    name: License header check tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test license header check
        run: bash tests/check-license-header.sh

  soundness-plan-checks:
    name: Soundness plan checks tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test soundness check planning
        run: bash tests/soundness-plan-checks-tests.sh
