name: Soundness

on:
  workflow_call:
    inputs:
      api_breakage_check_enabled:
        type: boolean
        description: "Boolean to enable the API breakage check job. Defaults to true."
        default: true
      api_breakage_check_allowlist_path:
        type: string
        description: "Path to a file that will be passed as --breakage-allowlist-path to swift package diagnose-api-breaking-changes"
        default: ""
      api_breakage_pre_build_command:
        type: string
        description: "Execute before running the AOU breakage check"
        default: ""
      api_breakage_check_baseline:
        type: string
        description: "The tag against which API breakages that should be used as the baseline for the API breakage check. By default the PR base is used."
        default: ""
      api_breakage_check_container_image:
        type: string
        description: "Container image for the API breakage check job. Defaults to latest Swift Ubuntu image."
        default: "swift:6.3-noble"
      api_breakage_check_additional_arguments:
        type: string
        description: "Additional arguments to pass directory to the `swift package diagnose-api-breaking-changes` invocation."
        default: ""
      docs_check_enabled:
        type: boolean
        description: "Boolean to enable the docs check job. Defaults to true."
        default: true
      docs_check_container_image:
        type: string
        description: "Container image for the docs check job. Defaults to latest Swift Ubuntu image."
        default: "swift:6.3-noble"
      docs_check_additional_arguments:
        type: string
        description: "Additional arguments that should be passed to docc"
        default: ""
      docs_check_targets:
        type: string
        description: "List of targets to check for documentation."
        default: ""
      docs_check_analyze:
        type: boolean
        description: "Boolean to pass --analyze to the docs check. Defaults to true."
        default: true
      docs_check_macos_enabled:
        type: boolean
        description: "Boolean to enable the macOS docs check job. Defaults to false."
        default: false
      docs_check_macos_version:
        type: string
        description: "macOS version for the macOS docs check job."
        default: "tahoe"
      docs_check_macos_arch:
        type: string
        description: "macOS arch for the macOS docs check job."
        default: "ARM64"
      docs_check_macos_xcode_version:
        type: string
        description: "Xcode version for the macOS docs check job."
        default: "26.0"
      docs_check_macos_additional_arguments:
        type: string
        description: "Additional arguments that should be passed to docc for the macOS docs check job."
        default: ""
      docs_check_macos_targets:
        type: string
        description: "List of targets to check for documentation."
        default: ""
      docs_check_macos_analyze:
        type: boolean
        description: "Boolean to pass --analyze to the macOS docs check. Defaults to true."
        default: true
      unacceptable_language_check_enabled:
        type: boolean
        description: "Boolean to enable the acceptable language check job. Defaults to true."
        default: true
      unacceptable_language_check_word_list:
        type: string
        description: "List of unacceptable words. Defaults to a sensible list of words."
        default: "blacklist whitelist slave master sane sanity insane insanity kill killed killing hang hung hanged hanging"  # ignore-unacceptable-language
      license_header_check_enabled:
        type: boolean
        description: "Boolean to enable the license header check job. Defaults to true."
        default: true
      license_header_check_project_name:
        type: string
        description: "Name of the project called out in the license header. Required unless `license_header_check_enabled` is false or a `.license_header_template` file is present."
        default: ""
      broken_symlink_check_enabled:
        type: boolean
        description: "Boolean to enable the broken symlink check job. Defaults to true."
        default: true
      format_check_enabled:
        type: boolean
        description: "Boolean to enable the format check job. Defaults to true."
        default: true
      format_check_container_image:
        type: string
        description: "Container image for the format check job. Defaults to latest Swift Ubuntu image."
        default: "swift:6.3-noble"
      shell_check_enabled:
        type: boolean
        description: "Boolean to enable the shell check job. Defaults to true."
        default: true
      shell_check_container_image:
        type: string
        description: "Container image for the shell check job. Defaults to latest Ubuntu 24.04 Noble image."
        default: "ubuntu:noble"
      yamllint_check_enabled:
        type: boolean
        description: "Boolean to enable the YAML lint check job. Defaults to true."
        default: true
      python_lint_check_enabled:
        type: boolean
        description: "Boolean to enable the Python lint check job. Defaults to true."
        default: true
      linux_pre_build_command:
        type: string
        description: "Linux command to execute before building the Swift package"
        default: ""
      concurrency_group_suffix:
        type: string
        description: "Optional suffix appended to the concurrency group. Use this when calling soundness.yml from a matrix so that matrix entries don't cancel each other."
        default: ""

permissions:
  contents: read

## We are cancelling previously triggered workflow runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-soundness-${{ inputs.concurrency_group_suffix }}
  cancel-in-progress: true

jobs:
  plan-checks:
    name: Plan checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      check_count: ${{ steps.plan.outputs.check_count }}
    steps:
      - name: Checkout swiftlang/github-workflows repository
        if: ${{ github.repository != 'swiftlang/github-workflows' }}
        uses: actions/checkout@v7
        with:
          repository: swiftlang/github-workflows
          path: github-workflows
          persist-credentials: false
      - name: Checkout repository
        if: ${{ github.repository == 'swiftlang/github-workflows' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Determine script-root path
        id: script_path
        run: |
          if [ "${{ github.repository }}" = "swiftlang/github-workflows" ]; then
            echo "root=$GITHUB_WORKSPACE" >> $GITHUB_OUTPUT
          else
            echo "root=$GITHUB_WORKSPACE/github-workflows" >> $GITHUB_OUTPUT
          fi
      - name: Plan the checks
        id: plan
        env:
          SCRIPT_ROOT: ${{ steps.script_path.outputs.root }}
          API_BREAKAGE_CHECK_ENABLED: ${{ inputs.api_breakage_check_enabled }}
          API_BREAKAGE_CHECK_CONTAINER_IMAGE: ${{ inputs.api_breakage_check_container_image }}
          DOCS_CHECK_ENABLED: ${{ inputs.docs_check_enabled }}
          DOCS_CHECK_CONTAINER_IMAGE: ${{ inputs.docs_check_container_image }}
          DOCS_CHECK_MACOS_ENABLED: ${{ inputs.docs_check_macos_enabled }}
          DOCS_CHECK_MACOS_VERSION: ${{ inputs.docs_check_macos_version }}
          DOCS_CHECK_MACOS_ARCH: ${{ inputs.docs_check_macos_arch }}
          UNACCEPTABLE_LANGUAGE_CHECK_ENABLED: ${{ inputs.unacceptable_language_check_enabled }}
          LICENSE_HEADER_CHECK_ENABLED: ${{ inputs.license_header_check_enabled }}
          BROKEN_SYMLINK_CHECK_ENABLED: ${{ inputs.broken_symlink_check_enabled }}
          FORMAT_CHECK_ENABLED: ${{ inputs.format_check_enabled }}
          FORMAT_CHECK_CONTAINER_IMAGE: ${{ inputs.format_check_container_image }}
          SHELL_CHECK_ENABLED: ${{ inputs.shell_check_enabled }}
          SHELL_CHECK_CONTAINER_IMAGE: ${{ inputs.shell_check_container_image }}
          YAMLLINT_CHECK_ENABLED: ${{ inputs.yamllint_check_enabled }}
          PYTHON_LINT_CHECK_ENABLED: ${{ inputs.python_lint_check_enabled }}
        run: |
          set -euo pipefail
          matrix=$("${SCRIPT_ROOT}/.github/workflows/scripts/soundness/plan-checks.sh")
          check_count=$(echo "$matrix" | jq '.include | length')
          echo "::notice::Running $check_count check(s): $(echo "$matrix" | jq -r '[.include[].name] | join(", ")')"
          echo "check_count=$check_count" >> $GITHUB_OUTPUT
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  check:
    name: ${{ matrix.name }}
    needs: plan-checks
    # GitHub rejects an empty matrix, so this is skipped when every check is turned off.
    if: ${{ needs.plan-checks.outputs.check_count != '0' }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-checks.outputs.matrix) }}
    steps:
      - name: Install git
        if: ${{ matrix.check == 'shell' }}
        run: which git || (apt -q update && apt -yq install git)
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The API breakage check clones the repository again with
          # `swift package diagnose-api-breaking-changes`, which fails for a
          # private repository unless the credentials persist.
          persist-credentials: ${{ matrix.check == 'api-breakage' }}
          submodules: true
          fetch-tags: ${{ matrix.full_history }}
          # Fetching tags requires fetch-depth: 0 (https://github.com/actions/checkout/issues/1471).
          # The depth is a string because 0 is falsy, so `&& 0 || 1` would always give 1.
          fetch-depth: ${{ matrix.full_history && '0' || '1' }}
      - name: Checkout swiftlang/github-workflows repository
        if: ${{ github.repository != 'swiftlang/github-workflows' }}
        uses: actions/checkout@v7
        with:
          repository: swiftlang/github-workflows
          path: github-workflows
          persist-credentials: false
      - name: Determine script-root path
        id: script_path
        run: |
          if [ "${{ github.repository }}" = "swiftlang/github-workflows" ]; then
            echo "root=$GITHUB_WORKSPACE" >> $GITHUB_OUTPUT
          else
            echo "root=$GITHUB_WORKSPACE/github-workflows" >> $GITHUB_OUTPUT
          fi
      - name: Mark the workspace as safe
        if: ${{ matrix.container != '' }}
        # https://github.com/actions/checkout/issues/766
        run: git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: Pre-build
        if: ${{ matrix.check == 'api-breakage' }}
        shell: bash
        env:
          API_BREAKAGE_PRE_BUILD_COMMAND: ${{ inputs.api_breakage_pre_build_command }}
        run: eval "${API_BREAKAGE_PRE_BUILD_COMMAND}"
      - name: Run check
        shell: bash
        env:
          CHECK: ${{ matrix.check }}
          SCRIPT_ROOT: ${{ steps.script_path.outputs.root }}
          LINUX_PRE_BUILD_COMMAND: ${{ inputs.linux_pre_build_command }}
          API_BREAKAGE_CHECK_BASELINE: ${{ inputs.api_breakage_check_baseline }}
          API_BREAKAGE_CHECK_ALLOWLIST_PATH: ${{ inputs.api_breakage_check_allowlist_path }}
          API_BREAKAGE_CHECK_ADDITIONAL_ARGUMENTS: ${{ inputs.api_breakage_check_additional_arguments }}
          DOCS_CHECK_ADDITIONAL_ARGUMENTS: ${{ inputs.docs_check_additional_arguments }}
          DOCS_CHECK_ANALYZE: ${{ inputs.docs_check_analyze }}
          DOCS_CHECK_TARGETS: ${{ inputs.docs_check_targets }}
          DOCS_CHECK_MACOS_ADDITIONAL_ARGUMENTS: ${{ inputs.docs_check_macos_additional_arguments }}
          DOCS_CHECK_MACOS_ANALYZE: ${{ inputs.docs_check_macos_analyze }}
          DOCS_CHECK_MACOS_TARGETS: ${{ inputs.docs_check_macos_targets }}
          DOCS_CHECK_MACOS_XCODE_VERSION: ${{ inputs.docs_check_macos_xcode_version }}
          UNACCEPTABLE_WORD_LIST: ${{ inputs.unacceptable_language_check_word_list }}
          PROJECT_NAME: ${{ inputs.license_header_check_project_name }}
        run: ${SCRIPT_ROOT}/.github/workflows/scripts/soundness/run-check.sh "${CHECK}"
